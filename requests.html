<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c2b3a">
<title>Request a Song</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #1c2b3a; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  main { width: 100%; max-width: 460px; padding: 32px 24px; text-align: center; }
  h1 { font-size: 34px; margin: 0 0 6px; letter-spacing: -0.5px; }
  p.sub { color: #9fb0c0; margin: 0 0 24px; font-size: 15px; }
  input {
    width: 100%; font-size: 17px; padding: 14px 16px; margin-bottom: 12px;
    border: 1px solid #3a4d5f; border-radius: 12px; background: #243747; color: #fff; font-family: inherit;
  }
  input::placeholder { color: #7c8fa1; }
  button {
    width: 100%; font-size: 18px; font-weight: 600; padding: 15px; margin-top: 6px;
    border: 0; border-radius: 12px; background: #4da3ff; color: #0f1a24; cursor: pointer; font-family: inherit;
  }
  button:disabled { opacity: .6; }
  .divider { display: flex; align-items: center; gap: 12px; margin: 26px 0 4px; color: #7c8fa1; font-size: 13px; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: #3a4d5f; }
  .opt { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .opt button { font-size: 15px; padding: 13px 8px; margin: 0; background: #243747; color: #fff; border: 1px solid #3a4d5f; }
  .opt button.primary { background: #4da3ff; color: #0f1a24; border-color: #4da3ff; }
  .opt button.wide { grid-column: 1 / -1; }
  .opt button.fun { background: #f0c987; color: #0f1a24; border-color: #f0c987; }
  .opt button:active { filter: brightness(1.15); }
  #msg { margin-top: 16px; font-size: 15px; color: #9fd8a8; min-height: 22px; }
</style>
</head>
<body>
<main>
  <div style="font-size:12px;letter-spacing:3px;color:#7c8fa1;margin-bottom:8px;font-weight:700;">TOOLGIG</div>
  <h1>Request a Song</h1>
  <p class="sub">It's free, but tipping is optional.</p>
  <div id="formWrap">
    <input id="song" placeholder="Song title *" autocomplete="off">
    <div id="odds" style="display:none;margin:-4px 0 12px;text-align:left;">
      <div style="display:flex;justify-content:space-between;font-size:13px;color:#9fb0c0;margin-bottom:4px;">
        <span id="oddsLabel">Chance we'll play it</span>
        <span id="oddsPct" style="font-weight:700;color:#f0c987;">—</span>
      </div>
      <div style="height:6px;border-radius:4px;background:#3a4d5f;overflow:hidden;">
        <div id="oddsBar" style="height:100%;width:0%;border-radius:4px;background:linear-gradient(90deg,#4da3ff,#f0c987);transition:width .3s ease;"></div>
      </div>
    </div>
    <input id="artist" placeholder="Artist (optional)" autocomplete="off">
    <input id="note" placeholder="Dedication? (optional)" autocomplete="off">
    <input id="email" type="email" placeholder="Email (for payment links)" autocomplete="email">
    <button id="send" type="button">Send request</button>

    <div class="divider">Keep the night going</div>
    <div class="opt" id="opts"></div>
  </div>
  <div id="myStatus" style="display:none;border-radius:12px;padding:12px 14px;font-weight:600;margin:14px 0;text-align:left;"></div>
  <div id="queue"></div>
  <div id="msg"></div>
</main>
<script>
  // Backend: set FIREBASE_URL when using Netlify Drop (no functions):
  //   "https://yourproject-default-rtdb.firebaseio.com"
  // Leave empty to use the Netlify function at /.netlify/functions/requests.
  var FIREBASE_URL = "https://toolgig-663e4-default-rtdb.firebaseio.com";
  var ENDPOINT = "/.netlify/functions/requests";

  // Optional: your Google / Trustpilot / Facebook review link.
  // Set it and a "Leave a review" button appears on this page.
  var REVIEW_LINK = "";

  // Prices (in £) for the extra buttons — change freely.
  var PRICE_1_EXTRA = 10;   // 1 extra song
  var PRICE_2_EXTRA = 10;   // 2 extra songs
  var PRICE_STAY = 20;      // stay longer
  var PRICE_PACKUP = 200;   // pack up and go home (the fun one)

  // Your PayPal payment link — the paid/tip buttons open this automatically.
  var PAYPAL_LINK = "https://www.paypal.com/ncp/payment/AP7CGWT5R7ASQ";

  // The app's QR code adds ?m=<uid> to this page's URL. When present, requests
  // go straight to that musician's private inbox; otherwise to the shared inbox.
  var MUSICIAN = "";
  try {
    var qs = new URLSearchParams(location.search);
    MUSICIAN = (qs.get("m") || "").replace(/[^A-Za-z0-9_-]/g, "");
  } catch (e) {}

  // Payment links published by the musician (the app writes users/<uid>/public
  // when they sign in with links set). When available, paid/tip buttons open the
  // payment page immediately; otherwise we fall back to the "we'll send a link" flow.
  var pubLinks = { tip: "", extra: "" };
  var stageName = "";
  if (MUSICIAN && FIREBASE_URL) {
    fetch(FIREBASE_URL + "/users/" + encodeURIComponent(MUSICIAN) + "/public")
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d && d.links) pubLinks = { tip: String(d.links.tip || ""), extra: String(d.links.extra || "") };
        if (d && d.stageName) stageName = String(d.stageName);
      }).catch(function () {});
  }

  var sendBtn = document.getElementById("send");
  var optsEl = document.getElementById("opts");
  var msgEl = document.getElementById("msg");
  var queueEl = document.getElementById("queue");
  var busy = false;

  // Band odds: a fun, stable estimate of the chance the band plays your song
  // (based on the song, the artist field, and the queue — not a promise).
  var oddsEl = document.getElementById("odds");
  var oddsLabel = document.getElementById("oddsLabel");
  var oddsPct = document.getElementById("oddsPct");
  var oddsBar = document.getElementById("oddsBar");
  var oddsTimer = null;
  function bandOdds(song, artist) {
    var s = String(song || "").trim().toLowerCase();
    if (s.length < 2) return null;
    var h = 0;
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
    var pct = 55 + (h % 31); // 55-85, stable per song
    if (artist && String(artist).trim()) pct += 8;
    if (s.length < 14) pct += 5; // punchy titles are singalong gold
    var dup = queueSnapshot.some(function (q) { return q.song && q.song.toLowerCase() === s; });
    if (dup) return { pct: 100, dup: true };
    return { pct: Math.min(97, pct), dup: false };
  }
  function updateOdds() {
    var song = document.getElementById("song").value;
    var artist = document.getElementById("artist").value;
    var o = bandOdds(song, artist);
    if (!o || !oddsEl) { if (oddsEl) oddsEl.style.display = "none"; return; }
    oddsEl.style.display = "block";
    oddsPct.textContent = o.dup ? "already requested" : (o.pct + "%");
    oddsLabel.textContent = o.dup ? "Already in the queue" : "Chance we'll play it";
    oddsBar.style.width = (o.dup ? 100 : o.pct) + "%";
  }
  var songInp = document.getElementById("song");
  if (songInp) songInp.addEventListener("input", function () {
    clearTimeout(oddsTimer);
    oddsTimer = setTimeout(updateOdds, 250);
  });
  var artistInp = document.getElementById("artist");
  if (artistInp) artistInp.addEventListener("input", function () {
    clearTimeout(oddsTimer);
    oddsTimer = setTimeout(updateOdds, 250);
  });

  // Live queue: songs already requested by the audience (public read).
  var queueSnapshot = [];
  function renderQueue(list) {
    if (!queueEl) return;
    queueEl.innerHTML = "";
    var rows = (list || []).filter(function (r) {
      return r && r.status !== "declined" && r.status !== "paid" && r.song;
    });
    if (!rows.length) { queueEl.style.display = "none"; return; }
    queueEl.style.display = "block";
    rows.sort(function (a, b) { return (b.ts || 0) - (a.ts || 0); });
    var h = document.createElement("div");
    h.style.cssText = "font-size:12px;font-weight:700;color:#9fb0c0;margin:20px 0 8px;text-align:left;letter-spacing:1.5px;";
    h.textContent = "ALREADY REQUESTED";
    queueEl.appendChild(h);
    rows.forEach(function (r) {
      var row = document.createElement("div");
      row.style.cssText = "text-align:left;padding:9px 12px;margin:6px 0;background:#243747;border:1px solid #3a4d5f;border-radius:10px;";
      var t = document.createElement("div");
      t.style.cssText = "font-weight:600;font-size:15px;";
      t.textContent = r.song;
      var a = document.createElement("div");
      a.style.cssText = "font-size:13px;color:#9fb0c0;";
      a.textContent = (r.artist || "") + (r.status === "accepted" ? " \u00b7 accepted!" : "");
      row.appendChild(t); row.appendChild(a);
      queueEl.appendChild(row);
    });
  }
  if (MUSICIAN && FIREBASE_URL) {
    setInterval(function () {
      fetch(FIREBASE_URL + "/users/" + encodeURIComponent(MUSICIAN) + "/requests.json")
        .then(function (r) { return r.json(); })
        .then(function (d) {
          var list = [];
          if (d && typeof d === "object") Object.keys(d).forEach(function (k) { if (d[k] && typeof d[k] === "object") { d[k].id = k; list.push(d[k]); } });
          queueSnapshot = list;
          renderQueue(list);
          // update the audience member's own request status (accepted/declined)
          if (myReq) {
            var hit = null;
            list.forEach(function (x) {
              if (!hit && x && x.song && String(x.song).toLowerCase() === String(myReq.song).toLowerCase() && x.status) hit = x;
            });
            if (hit) {
              myReq.status = hit.status;
              try { localStorage.setItem("sb2myreq", JSON.stringify(myReq)); } catch (e) {}
              renderMyStatus();
            }
          }
        }).catch(function () {});
    }, 5000);
  }

  // your own request's status — the band accepts/declines and this updates live
  var myReq = null;
  try { myReq = JSON.parse(localStorage.getItem("sb2myreq")) || null; } catch (e) {}
  var myStatusEl = document.getElementById("myStatus");
  function renderMyStatus() {
    if (!myStatusEl) return;
    if (!myReq) { myStatusEl.style.display = "none"; return; }
    myStatusEl.style.display = "block";
    if (myReq.status === "accepted") { myStatusEl.style.background = "#9fd8a8"; myStatusEl.style.color = "#1c2733"; myStatusEl.textContent = "\u2713 Accepted \u2014 you'll hear it soon!"; }
    else if (myReq.status === "declined") { myStatusEl.style.background = "#c05a50"; myStatusEl.style.color = "#fff"; myStatusEl.textContent = "\u2717 Declined this time \u2014 try another!"; }
    else { myStatusEl.style.background = "#f0c987"; myStatusEl.style.color = "#1c2733"; myStatusEl.textContent = "\u2022 Waiting for the band\u2026 stay on this screen and we'll update it here."; }
  }
  renderMyStatus();

  function say(txt) { msgEl.textContent = txt; }
  function mail() { return document.getElementById("email").value.trim().slice(0, 120); }

  function target() {
    if (MUSICIAN) return FIREBASE_URL + "/users/" + encodeURIComponent(MUSICIAN) + "/requests.json";
    return FIREBASE_URL ? FIREBASE_URL + "/requests.json" : ENDPOINT;
  }

  function post(payload, doneMsg) {
    if (busy) return;
    busy = true;
    say("Sending…");
    var body = FIREBASE_URL
      ? JSON.stringify(payload)
      : JSON.stringify({ song: payload.song, artist: payload.artist, note: payload.note });
    fetch(target(), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: body
    }).then(function (res) {
      if (!res.ok) throw new Error("bad status");
      say(doneMsg || "Got it — thanks!");
      if (payload.song) {
        myReq = { song: String(payload.song).slice(0, 80), ts: payload.ts || Date.now(), status: "" };
        try { localStorage.setItem("sb2myreq", JSON.stringify(myReq)); } catch (e) {}
        renderMyStatus();
      }
      document.getElementById("song").value = "";
      document.getElementById("artist").value = "";
      document.getElementById("note").value = "";
    }).catch(function () {
      say("Something went wrong — try again.");
    }).then(function () {
      busy = false;
    });
  }

  sendBtn.addEventListener("click", function () {
    var song = document.getElementById("song").value.trim();
    if (!song) { say("Type a song first!"); return; }
    var dup = queueSnapshot.some(function (q) { return q.song && q.song.toLowerCase() === song.toLowerCase(); });
    post({
      song: song.slice(0, 80),
      artist: document.getElementById("artist").value.trim().slice(0, 80),
      note: document.getElementById("note").value.trim().slice(0, 200),
      email: mail(),
      ts: Date.now()
    }, dup ? "That's already in the queue — we'll get to it!" : "Got it — thanks! Stay on this screen and we'll update it when the band replies.");
  });

  function paidButton(label, payload, doneMsg, cls) {
    var b = document.createElement("button");
    b.type = "button";
    b.textContent = label;
    if (cls) b.className = cls;
    b.addEventListener("click", function () {
      payload.email = mail();
      payload.ts = Date.now();
      // always open the band's PayPal link (per-purpose links win if set,
      // otherwise the PayPal link configured below) and still tell the band
      var pay = payload.charge ? (pubLinks.extra || PAYPAL_LINK) : (payload.tip ? (pubLinks.tip || PAYPAL_LINK) : "");
      if (pay) {
        var u = payload.charge ? pay.replace("{{AMOUNT}}", payload.charge) : pay;
        if (window.open) window.open(u, "_blank"); else location.href = u;
        post(payload, "Payment page opened \u2014 thanks!");
      } else {
        post(payload, doneMsg);
      }
    });
    optsEl.appendChild(b);
  }

  paidButton("Tip the band", { type: "tip", tip: true }, "Tip sent — the band's on it!");
  paidButton("£" + PRICE_1_EXTRA + " — 1 extra song", { type: "songs", songs: 1, charge: PRICE_1_EXTRA }, "Extra song requested — we'll send a payment link.", "primary");
  paidButton("£" + PRICE_2_EXTRA + " — 2 extra songs", { type: "songs", songs: 2, charge: PRICE_2_EXTRA }, "Extra songs requested — we'll send a payment link.");
  paidButton("£" + PRICE_STAY + " — stay longer", { type: "stay", charge: PRICE_STAY }, "More time requested — we'll send a payment link.");
  paidButton("£" + PRICE_PACKUP + " — pack up and go home", { type: "packup", charge: PRICE_PACKUP }, "Ha! Request sent — the band will be in touch.", "fun wide");

  // Leave a review — always available; opens your review link when set, else
  // a Google search for the band so punters can still find where to review.
  var rv = document.createElement("button");
  rv.type = "button";
  rv.textContent = "Leave a review";
  rv.className = "wide";
  rv.addEventListener("click", function () {
    var url = REVIEW_LINK || ("https://www.google.com/search?q=" + encodeURIComponent((stageName || "TOOLGIG band") + " review"));
    if (window.open) window.open(url, "_blank"); else location.href = url;
  });
  optsEl.appendChild(rv);
</script>
</body>
</html>
