<title>Setlist Builder — The Gigging Musician's Toolkit</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #f2f5f8;
    color: #1c2733;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap { max-width: 540px; margin: 0 auto; padding: 18px 14px 48px; }

  header { text-align: center; padding: 6px 4px 4px; }
  header h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -0.3px; }
  header p { margin: 0 0 14px; color: #5c6b7a; font-size: 14px; }

  .progress-card {
    background: #1c2b3a; color: #fff; border-radius: 14px; padding: 14px 16px;
  }
  .progress-row { display: flex; align-items: center; gap: 12px; }
  .progress-card .label { font-size: 13px; opacity: .85; }
  .progress-card .count { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
  .progress-card .count small { font-size: 13px; font-weight: 400; opacity: .6; }
  .bar { flex: 1; height: 8px; border-radius: 99px; background: rgba(255,255,255,.18); overflow: hidden; }
  .bar > div { height: 100%; width: 0%; border-radius: 99px; background: #4da3ff; transition: width .25s ease; }
  .set-fills { display: flex; gap: 16px; margin-top: 10px; font-size: 13px; opacity: .9; }
  .set-fills b { color: #4da3ff; font-weight: 600; }

  .tabs { display: flex; gap: 8px; margin: 14px 0 4px; }
  .tab {
    flex: 1; border: 1px solid #c8d3dd; background: #fff; color: #41505e;
    font-size: 14px; padding: 11px 6px; border-radius: 11px; cursor: pointer;
    text-align: center; font-weight: 500;
  }
  .tab.active { background: #1c2b3a; border-color: #1c2b3a; color: #fff; }

  section.card { background: #fff; border-radius: 14px; margin: 12px 0; box-shadow: 0 1px 2px rgba(20,30,45,.06); overflow: hidden; }
  .card .head { display: flex; gap: 12px; align-items: flex-start; padding: 13px 14px; cursor: pointer; }
  .card .head:active { background: #f6f9fc; }
  .card h2 { margin: 0; padding: 12px 16px; font-size: 15px; letter-spacing: .2px; color: #1c2b3a; background: #eaf0f6; border-bottom: 1px solid #dde6ee; }

  .song { flex: 1; min-width: 0; }
  .song .name { font-size: 16px; font-weight: 600; }
  .song .name.empty { color: #93a1af; font-weight: 400; }
  .song .artist { font-size: 13px; color: #5c6b7a; margin-top: 1px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
  .chip { font-size: 12px; background: #eef3f7; color: #41505e; border-radius: 99px; padding: 3px 9px; }
  .chip.key { background: #e6eef7; color: #1f5fa8; }
  .chip.status-ready { background: #e4f2e6; color: #237a3b; }
  .chip.status-learning { background: #fdf3dd; color: #8a6a1c; }
  .chip.status-retire { background: #fbe7e5; color: #a03027; }

  .dots { display: flex; gap: 4px; align-items: center; }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: #dde6ee; }
  .dot.on { background: #1f6feb; }

  .edit { padding: 0 14px 14px; border-top: 1px solid #edf1f5; }
  .edit .row { display: flex; gap: 10px; margin-top: 12px; }
  .edit label { flex: 1; display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #5c6b7a; }
  .edit input, .edit select {
    font-size: 16px; padding: 9px 10px; border: 1px solid #c8d3dd; border-radius: 9px;
    background: #fff; color: #1c2733; width: 100%; font-family: inherit;
  }
  .edit .dots { margin-top: 6px; }
  .edit .dot { width: 26px; height: 26px; cursor: pointer; }
  .song-field { position: relative; }
  .suggest {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 20;
    background: #fff; border: 1px solid #c8d3dd; border-radius: 10px;
    box-shadow: 0 6px 18px rgba(20,30,45,.14); max-height: 260px; overflow-y: auto;
  }
  .s-item {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    width: 100%; text-align: left; background: none; border: 0;
    padding: 10px 12px; font-size: 15px; font-family: inherit; color: #1c2733;
    border-bottom: 1px solid #edf1f5; cursor: pointer;
  }
  .s-item:last-child { border-bottom: 0; }
  .s-item:active { background: #eef3f7; }
  .s-item small { display: block; color: #5c6b7a; font-weight: 400; margin-top: 1px; }
  .s-item .tag { font-size: 11px; color: #1f6feb; flex-shrink: 0; }
  .s-empty { padding: 12px; font-size: 13px; color: #8a97a5; }
  .edit .btns { display: flex; gap: 10px; margin-top: 14px; }
  .btn {
    flex: 1; border: 0; border-radius: 10px; padding: 12px; font-size: 15px;
    font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .btn.save { background: #1f6feb; color: #fff; }
  .btn.ug { background: #eef3f7; color: #41505e; }
  .btn.del { background: #fbe7e5; color: #a03027; }
  .btn.add {
    width: 100%; margin-top: 12px; border: 1.5px dashed #a9b8c6; background: transparent;
    color: #41505e; padding: 15px; border-radius: 14px; font-size: 15px; font-weight: 500; cursor: pointer;
  }

  .slot .song .name { font-size: 15px; }
  .slot .time { font-size: 13px; color: #5c6b7a; margin-top: 1px; }
  .slot .purpose { font-size: 13px; color: #41505e; margin-top: 6px; line-height: 1.4; }
  .slot select {
    margin-top: 10px; width: 100%; font-size: 16px; padding: 9px 10px;
    border: 1px solid #c8d3dd; border-radius: 9px; background: #fff; color: #1c2733;
    font-family: inherit; -webkit-appearance: none; appearance: none;
  }
  .slot-pick { margin-top: 10px; }

  .songs-search {
    width: 100%; font-size: 16px; padding: 12px 14px; margin: 12px 0 8px;
    border: 1px solid #c8d3dd; border-radius: 12px; background: #fff; color: #1c2733; font-family: inherit;
  }
  .songs-count { font-size: 12px; color: #8a97a5; margin: 0 2px 6px; }
  .song-row .head { cursor: pointer; }
  .toolbar { display: flex; gap: 8px; margin: 12px 0 4px; flex-wrap: wrap; align-items: center; }
  .btn.small {
    flex: 0 0 auto; border: 1px solid #c8d3dd; background: #fff; color: #41505e;
    font-size: 13px; padding: 9px 14px; border-radius: 10px; cursor: pointer;
    font-family: inherit; font-weight: 500;
  }
  .btn.small:active { background: #eef3f7; }
  .btn.small.primary { background: #1c2b3a; border-color: #1c2b3a; color: #fff; }
  .slot .song .name.tappable { color: #1f6feb; cursor: pointer; }
  .modal-bg {
    position: fixed; inset: 0; background: rgba(20,30,45,.55); z-index: 40;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .sheet {
    background: #fff; width: 100%; max-width: 540px; border-radius: 18px 18px 0 0;
    padding: 20px 18px 26px; box-shadow: 0 -6px 24px rgba(20,30,45,.25);
  }
  .sheet h3 { margin: 0 0 2px; font-size: 19px; color: #1c2733; }
  .sheet .sub { color: #5c6b7a; font-size: 14px; margin-bottom: 10px; }
  .sheet .notes { font-size: 14px; color: #41505e; line-height: 1.5; margin: 8px 0 14px; }
  .sheet .btns { display: flex; gap: 10px; }
  .play-view .pcard {
    background: #fff; border-radius: 16px; padding: 22px 18px; text-align: center;
    margin-top: 12px; box-shadow: 0 1px 2px rgba(20,30,45,.06);
  }
  .play-view .pname { font-size: 24px; font-weight: 700; color: #1c2733; }
  .play-view .partist { color: #5c6b7a; font-size: 15px; margin-top: 4px; }
  .play-view .pchips { display: flex; justify-content: center; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
  .play-view .pnote { font-size: 15px; color: #41505e; margin-top: 14px; line-height: 1.5; }
  .play-bar { display: flex; align-items: center; gap: 10px; margin-top: 16px; font-size: 13px; color: #5c6b7a; }
  .play-bar input[type=range] { flex: 1; }
  .play-ctrls { display: flex; gap: 10px; margin-top: 14px; }
  .play-ctrls .btn { flex: 1; }
  .play-count { font-size: 13px; color: #5c6b7a; margin-top: 10px; }
  .progress-track { height: 8px; background: #e3eaf1; border-radius: 99px; margin-top: 12px; overflow: hidden; }
  .progress-track > div { height: 100%; background: #1f6feb; border-radius: 99px; transition: width .3s; }

  .sheet .chords {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 13px; line-height: 1.55; color: #1c2733;
    background: #f6f9fc; border: 1px solid #e3eaf1; border-radius: 10px;
    padding: 12px; margin: 8px 0 14px; max-height: 46vh; overflow-y: auto;
    white-space: pre-wrap; word-break: break-word;
  }

  .tabs .tab { font-size: 13px; padding: 11px 2px; }
  .lyr-ctrl { display: flex; align-items: center; gap: 8px; margin: 8px 0 10px; flex-wrap: wrap; }
  .lyr-ctrl input[type=range] { flex: 1; min-width: 90px; }
  .lyr-ctrl span { font-size: 12px; color: #5c6b7a; }
  .modal-bg.max { align-items: stretch; }
  .modal-bg.max .sheet { max-width: none; border-radius: 0; height: 100%; display: flex; flex-direction: column; }
  .modal-bg.max .chords { flex: 1; max-height: none; }
  .req-row .fit-badge { flex-shrink: 0; font-size: 12px; font-weight: 600; border-radius: 99px; padding: 4px 10px; }
  .fit-high { background: #e4f2e6; color: #237a3b; }
  .fit-med { background: #fdf3dd; color: #8a6a1c; }
  .fit-low { background: #fbe7e5; color: #a03027; }
  .ug-search { display: flex; gap: 8px; margin: 12px 0 4px; }
  .ug-search input { flex: 1; font-size: 15px; padding: 10px 12px; border: 1px solid #c8d3dd; border-radius: 10px; font-family: inherit; }
  .rec-note { font-size: 12px; color: #8a97a5; margin: 8px 2px 0; }
  .qr-box img { width: 100%; max-width: 320px; display: block; margin: 12px auto; }

  footer { text-align: center; margin-top: 18px; }
  footer .reset {
    border: 1px solid #c8d3dd; background: #fff; color: #41505e;
    font-size: 14px; padding: 10px 22px; border-radius: 99px; cursor: pointer;
  }
  footer .reset:active { background: #eef3f7; }
  footer .note { font-size: 12px; color: #8a97a5; margin-top: 12px; line-height: 1.5; }

  @media print {
    body { background: #fff; }
    .progress-card, .tabs, footer .reset, .btn, .edit { display: none; }
    .wrap { max-width: none; padding: 0; }
    .card { box-shadow: none; border: 1px solid #ccc; break-inside: avoid; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Setlist Builder</h1>
    <p>30-song pool · 4 × 45-min sets (2 per tab) · 600-song catalog</p>
  </header>

  <div class="progress-card">
    <div class="progress-row">
      <div class="label">Pool</div>
      <div class="bar"><div id="barFill"></div></div>
      <div class="count"><span id="poolCount">0</span><small>/30</small></div>
    </div>
    <div class="set-fills">
      <span>Set A: <b id="fillA">0</b>/24</span>
      <span>Set B: <b id="fillB">0</b>/24</span>
    </div>
  </div>

  <div class="tabs">
    <button class="tab" id="tabSongs" type="button">Songs</button>
    <button class="tab active" id="tabPool" type="button">Pool</button>
    <button class="tab" id="tabA" type="button">Set A</button>
    <button class="tab" id="tabB" type="button">Set B</button>
    <button class="tab" id="tabRequests" type="button">Requests</button>
  </div>

  <main id="list"></main>

  <footer>
    <button class="reset" id="resetBtn" type="button">Start fresh</button>
    <p class="note">Everything is saved on this device — close the page and it's still there.</p>
  </footer>
</div>

  function matches(q, exclude) {
    q = q.toLowerCase();
    var res = [];
    filledSongs().forEach(function (song) {
      if (song === exclude) return; // don't suggest the song being typed
      var sm = song.name ? song.name.toLowerCase() : "";
      var am = song.artist ? song.artist.toLowerCase() : "";
      if (sm.indexOf(q) >= 0 || am.indexOf(q) >= 0) {
        res.push({ title: song.name, artist: song.artist, key: song.key, bpm: song.bpm, pool: true });
      }
    });
    CATALOG.forEach(function (c) {
      if (c[0].toLowerCase().indexOf(q) >= 0 || c[1].toLowerCase().indexOf(q) >= 0) {
        res.push({ title: c[0], artist: c[1], key: c[2], bpm: c[3], pool: false });
      }
    });
    var seen = {};
    res = res.filter(function (r) {
      var k = r.title.toLowerCase() + "|" + (r.artist || "").toLowerCase();
      if (seen[k]) return false;
      seen[k] = true;
      return true;
    });
    return res.slice(0, 6);
  }

  function showSug(sug, inp, song, q) {

    var res = matches(q, song);
    sug.innerHTML = "";
    if (!res.length) {
      var e = document.createElement("div");
      e.className = "s-empty";
      e.textContent = "No matches — keep typing, or tap Save to add it as-is";
      sug.appendChild(e);

          sug.style.display = "none";

        sug.appendChild(b);

    sug.style.display = "block";
  }

    if (!hit) return;
    if (!song.artist) song.artist = hit[1];
    if (!song.key) song.key = hit[2] || "";
    if (!song.bpm) song.bpm = hit[3] || "";
    if (editRefs.artist) editRefs.artist.value = song.artist;

    close.type = "button"; close.className = "btn ug"; close.textContent = "Close";
    close.addEventListener("click", function () { closeSheet(bg); });
    btns.appendChild(ug); btns.appendChild(close);
    sheet.appendChild(h); sheet.appendChild(sub);

    var chords = null;
    var cb = CHORDBOOK[(song.name || "") + "|" + (song.artist || "")];
    if (cb && cb.text) {
      chords = document.createElement("div");
      chords.className = "chords";
      chords.textContent = cb.text;
      sheet.appendChild(chords);

      // auto-scroll + expand controls
      var ctrl = document.createElement("div");
      ctrl.className = "lyr-ctrl";
      var playBtn = document.createElement("button");
      playBtn.type = "button";
      playBtn.className = "btn ug";
      playBtn.textContent = "Auto-scroll";
      playBtn.addEventListener("click", function () { toggleScroll(chords, playBtn); });
      var speed = document.createElement("input");
      speed.type = "range"; speed.min = "5"; speed.max = "60"; speed.step = "5"; speed.value = "20";
      var spLbl = document.createElement("span");
      spLbl.textContent = "20px/s";
      speed.addEventListener("input", function () {
        scrollSpeed = +speed.value;
        spLbl.textContent = scrollSpeed + "px/s";
      });
      var expand = document.createElement("button");
      expand.type = "button";
      expand.className = "btn ug";
      expand.textContent = "Expand";
      expand.addEventListener("click", function () { toggleExpand(bg); });
      ctrl.appendChild(playBtn);
      ctrl.appendChild(speed);
      ctrl.appendChild(spLbl);
      ctrl.appendChild(expand);
      sheet.appendChild(ctrl);

      var srcLine = document.createElement("div");
      srcLine.className = "notes";
      srcLine.textContent = "Offline chord sheet for personal gig use · source: " + cb.url;
      sheet.appendChild(srcLine);
    } else {
      sheet.appendChild(notes);
    }
    sheet.appendChild(btns);
    bg.appendChild(sheet);
    bg.addEventListener("click", function (e) { if (e.target === bg) closeSheet(bg); });
    document.body.appendChild(bg);
  }

  function lenSecs(song) {
    var v = (song && song.len ? song.len : "").trim();
    if (!v) return 0;
    if (v.indexOf(":") >= 0) {
      var p = v.split(":");
      return ((+p[0]) || 0) * 60 + ((+p[1]) || 0);
    }
    var f = parseFloat(v);
    return isNaN(f) ? 0 : Math.round(f * 60);
  }

  function clearBlock(which, bi) {
    for (var i = 0; i < 12; i++) s.sets[which][bi][i] = -1;
    save(); render();
  }

  function autoFill(which, bi) {
    var engs = which === "A" ? SET_A_ENG : SET_B_ENG;
    var purps = which === "A" ? SET_A_PURP : SET_B_PURP;
    var pool = filledSongs();
    var used = {};
    ["A", "B"].forEach(function (w) {
      s.sets[w].forEach(function (block) {
        block.forEach(function (v) { if (v >= 0) used[v] = true; });
      });
    });
    var kw = { singalong: 20, dance: 20, quiet: 18, ballad: 18, breather: 15, build: 10, block: 10, opener: 8, closer: 8, request: 8, banter: 5 };
    var filled = 0;
    for (var i = 0; i < 12; i++) {
      if (s.sets[which][bi][i] >= 0) continue; // never overwrite a manual pick
      var best = -1, bestScore = -Infinity;
      pool.forEach(function (song, pi) {
        if (used[pi] || song.status === "Retire") return;
        var score = 100 - Math.abs((song.energy || 3) - engs[i]) * 15;
        if (song.status === "Learning") score -= 30;
        var p = purps[i].toLowerCase(), n = (song.note || "").toLowerCase();
        Object.keys(kw).forEach(function (k) {
          if (p.indexOf(k) >= 0 && n.indexOf(k) >= 0) score += kw[k];
        });
        if (score > bestScore) { bestScore = score; best = pi; }
      });
      if (best < 0) break;
      s.sets[which][bi][i] = best;
      used[best] = true;
      filled++;
    }
    save(); render();
    return filled;
  }

  function playSongs() {
    var pool = filledSongs(), out = [];
    if (!play) return out;
    s.sets[play.which].forEach(function (block) {
      block.forEach(function (v) { if (v >= 0 && pool[v]) out.push(pool[v]); });
    });
    return out;
  }

  function enterPlay(which) {
    if (play && play.timer) clearInterval(play.timer);
    play = { which: which, idx: 0, playing: true, defaultSecs: 180, remaining: 180, timer: null, elCount: null, elFill: null, active: true };
    var songs = playSongs();
    if (!songs.length) { play = null; return; }
    play.remaining = lenSecs(songs[0]) || play.defaultSecs;
    play.timer = setInterval(function () { playTick(); }, 1000);
    render();
  }

  function playPct() {
    var songs = playSongs();
    return Math.round((play.idx + 1) / (songs.length || 1) * 100);
  }

  function playTick() {
    if (!play || !play.playing) return;
    play.remaining -= 1;
    if (play.remaining <= 0) {
      playNext();
    } else {
      if (play.elCount) play.elCount.textContent = "next up in " + fmt(play.remaining);
      if (play.elFill) play.elFill.style.width = playPct() + "%";
    }
  }

  function playNext() {
    var songs = playSongs();
    if (play.idx < songs.length - 1) {
      play.idx += 1;
      play.remaining = lenSecs(songs[play.idx]) || play.defaultSecs;
      renderPlay();
    } else {
      play.playing = false;
      play.remaining = 0;
      if (play.elCount) play.elCount.textContent = "End of set";
      if (play.elFill) play.elFill.style.width = "100%";
      var b = document.getElementById("playToggle");
      if (b) b.textContent = "Play";
    }
  }

  function playPrev() {
    var songs = playSongs();
    if (play.idx > 0) {
      play.idx -= 1;
      play.remaining = lenSecs(songs[play.idx]) || play.defaultSecs;
      renderPlay();
    }
  }

  function togglePlay() {
    play.playing = !play.playing;
    if (play.elCount) play.elCount.textContent = play.playing ? "next up in " + fmt(play.remaining) : "paused · " + fmt(play.remaining);
    var b = document.getElementById("playToggle");
    if (b) b.textContent = play.playing ? "Pause" : "Play";
  }

  function exitPlay() {
    if (play && play.timer) clearInterval(play.timer);
    play = null;
  }

  function renderPlay() {
    var songs = playSongs();
    listEl.innerHTML = "";
    var wrap = document.createElement("div");
    wrap.className = "play-view";
    var top = document.createElement("div");
    top.className = "toolbar";
    top.appendChild(mkBtn("Exit play", function () { exitPlay(); render(); }));
    var countLbl = document.createElement("span");
    countLbl.style.cssText = "flex:1;font-size:13px;color:#5c6b7a;align-self:center;";
    countLbl.textContent = "Set " + play.which + " · song " + (play.idx + 1) + "/" + songs.length;
    top.appendChild(countLbl);
    wrap.appendChild(top);

    if (!songs.length) {
      var none = document.createElement("div");
      none.className = "pcard";
      none.textContent = "No songs assigned to this set yet — assign some first.";
      wrap.appendChild(none);
    } else {
      var song = songs[play.idx];
      var card = document.createElement("div");
      card.className = "pcard";
      card.style.cursor = "pointer";
      card.addEventListener("click", function () { openSheet(song); });
      var pn = document.createElement("div"); pn.className = "pname"; pn.textContent = song.name || "—";
      var pa = document.createElement("div"); pa.className = "partist"; pa.textContent = song.artist || "";
      var chips = document.createElement("div"); chips.className = "pchips";
      [song.key && "key " + song.key, song.capo && "capo " + song.capo, song.bpm && song.bpm + " bpm", song.len && song.len]
        .forEach(function (c) { if (c) { var ch = document.createElement("span"); ch.className = "chip key"; ch.textContent = c; chips.appendChild(ch); } });
      var note = document.createElement("div"); note.className = "pnote";
      note.textContent = song.note || "tap the card for chords & lyrics";
      card.appendChild(pn); card.appendChild(pa); card.appendChild(chips); card.appendChild(note);
      wrap.appendChild(card);

      var bar = document.createElement("div");
      bar.className = "play-bar";
      var slider = document.createElement("input");
      slider.type = "range"; slider.min = "20"; slider.max = "300"; slider.step = "5"; slider.value = play.defaultSecs;
      slider.addEventListener("input", function () {
        play.defaultSecs = +slider.value;
        if (!lenSecs(song)) {
          play.remaining = play.defaultSecs;
          if (play.elCount) play.elCount.textContent = "next up in " + fmt(play.remaining);
        }
        var lbl = document.getElementById("playSecs");
        if (lbl) lbl.textContent = play.defaultSecs + "s / song";
      });
      var lbl = document.createElement("span");
      lbl.id = "playSecs"; lbl.textContent = play.defaultSecs + "s / song";
      bar.appendChild(slider); bar.appendChild(lbl);
      wrap.appendChild(bar);

      var ctrls = document.createElement("div"); ctrls.className = "play-ctrls";
      var prevB = mkBtn("Prev", playPrev);
      var togB = mkBtn(play.playing ? "Pause" : "Play", togglePlay);
      togB.id = "playToggle";
      var nextB = mkBtn("Next", playNext);
      ctrls.appendChild(prevB); ctrls.appendChild(togB); ctrls.appendChild(nextB);
      wrap.appendChild(ctrls);

      var cnt = document.createElement("div");
      cnt.className = "play-count";
      cnt.id = "playCount";
      cnt.textContent = play.playing ? "next up in " + fmt(play.remaining) : "paused · " + fmt(play.remaining);
      wrap.appendChild(cnt);
      play.elCount = cnt;

      var prog = document.createElement("div");
      prog.className = "progress-track";
      var fill = document.createElement("div");
      fill.id = "playFill";
      fill.style.width = playPct() + "%";
      prog.appendChild(fill);
      wrap.appendChild(prog);
      play.elFill = fill;
    }
    listEl.appendChild(wrap);
  }

  // ---------- pool recommendations ----------
  function recommendSongs() {
    var pool = filledSongs();
    var have = {};
    pool.forEach(function (x) { have[(x.name + "|" + (x.artist || "")).toLowerCase()] = true; });
    var energyCount = { high: 0, mid: 0, low: 0 };
    pool.forEach(function (x) {
      var e = x.energy || 3;
      if (e >= 4) energyCount.high++; else if (e === 3) energyCount.mid++; else energyCount.low++;
    });
    var artists = {};
    pool.forEach(function (x) { if (x.artist) artists[x.artist.toLowerCase()] = true; });
    var scored = [];
    CATALOG.forEach(function (c) {
      if (have[(c[0] + "|" + c[1]).toLowerCase()]) return;
      var score = 50;
      var reasons = [];
      if (CHORDBOOK[c[0] + "|" + c[1]]) { score += 15; reasons.push("lyrics ready"); }
      if (artists[c[1].toLowerCase()]) { score += 10; reasons.push("you play " + c[1]); }
      if (energyCount.high === 0) { score += 8; reasons.push("adds high energy"); }
      if (energyCount.low === 0) { score += 8; reasons.push("adds a calm song"); }
      if (!reasons.length) reasons.push("crowd favourite");
      scored.push({ title: c[0], artist: c[1], key: c[2], bpm: c[3], score: score, reasons: reasons });
    });
    scored.sort(function (a, b) { return b.score - a.score; });
    poolRecs = scored.slice(0, 6);
    render();
  }

  function addCatalogToPool(title, artist, key, bpm) {
    var pool = filledSongs();
    var dup = pool.some(function (x) {
      return x.name && x.name.toLowerCase() === title.toLowerCase() &&
        (!artist || (x.artist || "").toLowerCase() === artist.toLowerCase());
    });
    if (dup) return false;
    var idx = -1;
    for (var i = 0; i < POOL; i++) if (!s.songs[i].name) { idx = i; break; }
    if (idx < 0) return false;
    s.songs[idx] = { name: title, artist: artist || "", key: key || "", capo: "", bpm: bpm || "", energy: 3, note: "", trans: "", status: "Ready", len: "" };
    save(); render();
    return true;
  }

  // ---------- Ultimate Guitar online search (hosted) ----------
  function ugSearchOnline(q) {
    if (!q) return;
    ugResults = []; ugNote = "";
    if (!HOSTED) {
      ugNote = "Online search needs the hosted app. Offline, search the built-in 600-song catalog.";
      render();
      return;
    }
    fetch(API_BASE + "/.netlify/functions/ug-search?q=" + encodeURIComponent(q)).then(function (r) { return r.json(); }).then(function (res) {
      ugResults = Array.isArray(res) ? res.slice(0, 8) : [];
      ugNote = ugResults.length ? "" : "No results found.";
      render();
    }).catch(function () {
      ugNote = "Online search unavailable — check the app is hosted.";
      render();
    });
  }

  // ---------- audience requests (hosted) ----------
  function requestFit(song, artist) {
    var sl = song.toLowerCase();
    var a = (artist || "").toLowerCase();
    var pool = filledSongs();
    var match = null;
    pool.forEach(function (x) {
      if (match) return;
      if (x.name && x.name.toLowerCase() === sl && (!a || (x.artist || "").toLowerCase() === a)) match = x;
    });
    if (match) {
      var inSet = false;
      ["A", "B"].forEach(function (w) {
        s.sets[w].forEach(function (b) {
          b.forEach(function (v) {
            if (v >= 0 && pool[v] && pool[v].name.toLowerCase() === sl) inSet = true;
          });
        });
      });
      return inSet ? 0.95 : 0.75;
    }
    if (CHORDBOOK[sl + "|" + a]) return 0.55;
    var inCat = CATALOG.some(function (c) { return c[0].toLowerCase() === sl; });
    return inCat ? 0.35 : 0.15;
  }

  function timeAgo(ts) {
    var sec = Math.max(0, Math.floor((Date.now() - ts) / 1000));
    if (sec < 60) return sec + "s ago";
    var m = Math.floor(sec / 60);
    if (m < 60) return m + "m ago";
    return Math.floor(m / 60) + "h ago";
  }

  function loadRequests() {
    if (!HOSTED) { renderRequests(); return; }
    fetch(API_BASE + "/.netlify/functions/requests").then(function (r) { return r.json(); }).then(function (list) {
      if (!Array.isArray(list)) throw new Error("bad response");
      var hadNew = requestsData.length > 0 && list.length > requestsData.length;
      requestsData = list;
      reqNote = "";
      renderRequests();
      if (hadNew) {
        var flash = document.createElement("div");
        flash.className = "fit-badge fit-high";
        flash.style.cssText = "display:block;text-align:center;margin:10px 0;padding:10px;font-size:14px;";
        flash.textContent = "New request just came in!";
        listEl.insertBefore(flash, listEl.firstChild);
        setTimeout(function () { if (flash.parentNode) flash.parentNode.removeChild(flash); }, 6000);
      }
    }).catch(function () {
      reqNote = "Can't reach the request server. Check the app is hosted and the function deployed.";
      renderRequests();
    });
  }

  function renderRequests() {
    listEl.innerHTML = "";
    if (s.tab !== "requests") return;
    var tb = document.createElement("div");
    tb.className = "toolbar";
    tb.appendChild(mkBtn("QR code", showQR));
    tb.appendChild(mkBtn("Refresh", loadRequests));
    listEl.appendChild(tb);

    if (!HOSTED) {
      var n = document.createElement("div");
      n.className = "s-empty";
      n.style.padding = "20px 4px";
      n.textContent = "Live requests need the hosted app. Host the files (Netlify Drop), set REQUESTS_PAGE_URL, then audience requests appear here in real time.";
      listEl.appendChild(n);
      return;
    }
    if (reqNote) {
      var nn = document.createElement("div");
      nn.className = "s-empty";
      nn.style.padding = "10px 4px";
      nn.textContent = reqNote;
      listEl.appendChild(nn);
    }
    if (!requestsData.length) {
      var e = document.createElement("div");
      e.className = "s-empty";
      e.style.padding = "20px 4px";
      e.textContent = "No requests yet — point the audience at your request page (QR button).";
      listEl.appendChild(e);
      return;
    }
    var sorted = requestsData.slice().sort(function (x, y) {
      var d = requestFit(y.song, y.artist) - requestFit(x.song, x.artist);
      return d !== 0 ? d : (y.ts || 0) - (x.ts || 0);
    });
    sorted.forEach(function (r) {
      var fit = requestFit(r.song, r.artist);
      var cls = fit >= 0.6 ? "fit-high" : (fit >= 0.35 ? "fit-med" : "fit-low");
      var badgeTxt = fit >= 0.6 ? "High" : (fit >= 0.35 ? "Med" : "Low");
      var sec = document.createElement("section");
      sec.className = "card req-row";
      var head = document.createElement("div");
      head.className = "head";
      head.style.cursor = "default";
      var box = document.createElement("div");
      box.className = "song";
      var name = document.createElement("div");
      name.className = "name";
      name.textContent = r.song + (r.artist ? " — " + r.artist : "");
      var meta = document.createElement("div");
      meta.className = "artist";
      meta.textContent = timeAgo(r.ts || Date.now()) + " · fit " + Math.round(fit * 100) + "%";
      var badgeEl = document.createElement("span");
      badgeEl.className = "fit-badge " + cls;
      badgeEl.textContent = badgeTxt;
      box.appendChild(name); box.appendChild(meta);
      head.appendChild(box); head.appendChild(badgeEl);
      sec.appendChild(head);
      var btnRow = document.createElement("div");
      btnRow.className = "slot-pick";
      var add = mkBtn("Add to pool", function () {
        if (addCatalogToPool(r.song, r.artist || "", "", "")) loadRequests();
      });
      btnRow.appendChild(add);
      sec.appendChild(btnRow);
      if (r.note) {
        var note = document.createElement("div");
        note.className = "purpose";
        note.textContent = "Note: " + r.note;
        sec.appendChild(note);
      }
      listEl.appendChild(sec);
    });
  }

  function showQR() {
    listEl.innerHTML = "";
    var sec = document.createElement("section");
    sec.className = "card qr-box";
    sec.style.padding = "20px 16px";
    var h = document.createElement("h3");
    h.textContent = "Audience request page";
    sec.appendChild(h);
    var img = document.createElement("img");
    img.src = "https://api.qrserver.com/v1/create-qr-code/?size=320x320&data=" + encodeURIComponent(REQUESTS_PAGE_URL);
    sec.appendChild(img);
    var url = document.createElement("div");
    url.className = "sub";
    url.style.wordBreak = "break-all";
    url.textContent = REQUESTS_PAGE_URL;
    sec.appendChild(url);
    var note = document.createElement("div");
    note.className = "notes";
    note.textContent = "Show this on stage or print it. First set REQUESTS_PAGE_URL at the top of the app file to your hosted requests.html URL.";
    sec.appendChild(note);
    var back = document.createElement("div");
    back.className = "btns";
    back.appendChild(mkBtn("Back to requests", function () { renderRequests(); }));
    sec.appendChild(back);
    listEl.appendChild(sec);
  }

  // ---------- lyrics auto-scroll + expand ----------
  function toggleScroll(el, btn) {
    if (scrollTimer) {
      clearInterval(scrollTimer);
      scrollTimer = null;
      if (btn) btn.textContent = "Auto-scroll";
      return;
    }
    scrollTimer = setInterval(function () {
      if (!el || !el.parentNode) { clearInterval(scrollTimer); scrollTimer = null; return; }
      el.scrollTop = (el.scrollTop || 0) + scrollSpeed / 5;
      if (el.scrollTop + el.clientHeight >= el.scrollHeight - 4) {
        clearInterval(scrollTimer);
        scrollTimer = null;
        if (btn) btn.textContent = "Auto-scroll";
      }
    }, 200);
    if (btn) btn.textContent = "Stop";
  }

  function stopScroll() {
    if (scrollTimer) { clearInterval(scrollTimer); scrollTimer = null; }
  }

  function toggleExpand(bg) {
    var max = bg.className.indexOf("max") >= 0;
    bg.className = max ? "modal-bg" : "modal-bg max";
    if (document.documentElement && document.documentElement.requestFullscreen) {
      try {
        if (!max && !document.fullscreenElement) document.documentElement.requestFullscreen();
        else if (max && document.fullscreenElement) document.exitFullscreen();
      } catch (e) {}
    }
  }

  function closeSheet(bg) {
    stopScroll();
    bg.style.display = "none";
  }

  function tab(btn, name) {
    btn.addEventListener("click", function () {
      exitPlay();
      s.tab = name; save(); render();
      [["tabSongs", "songs"], ["tabPool", "pool"], ["tabA", "A"], ["tabB", "B"], ["tabRequests", "requests"]].forEach(function (t) {
        document.getElementById(t[0]).classList.toggle("active", t[1] === name);
      });
      if (name === "requests") {
        loadRequests();
        if (!requestsTimer) requestsTimer = setInterval(loadRequests, 5000);
      }
    });
  }
  tab(document.getElementById("tabSongs"), "songs");
  tab(document.getElementById("tabPool"), "pool");
  tab(document.getElementById("tabA"), "A");
  tab(document.getElementById("tabB"), "B");
  tab(document.getElementById("tabRequests"), "requests");

  document.getElementById("resetBtn").addEventListener("click", function () {
    if (!confirm("Clear all songs and set assignments?")) return;
    s = DEF();
    for (var i = 0; i < POOL; i++) s.songs.push(emptySong());
    s.sets.A = [emptyBlock(), emptyBlock()];
    s.sets.B = [emptyBlock(), emptyBlock()];
    s.tab = "pool";
    save(); render();
    document.getElementById("tabSongs").classList.remove("active");
    document.getElementById("tabPool").classList.add("active");
    document.getElementById("tabA").classList.remove("active");
    document.getElementById("tabB").classList.remove("active");
    document.getElementById("tabRequests").classList.remove("active");
  });

  render();
})();
</script>

if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./sw.js").catch(function () {});
  });
}
