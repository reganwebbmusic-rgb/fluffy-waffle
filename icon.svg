<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#283b4e"/>
      <stop offset="1" stop-color="#141f2c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.32" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5fb2ff"/>
      <stop offset="1" stop-color="#1f6feb"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- soft drop shadow under guitar -->
  <ellipse cx="256" cy="452" rx="92" ry="15" fill="#000000" opacity="0.30" filter="url(#soft)"/>

  <!-- headstock -->
  <rect x="232" y="58" width="48" height="78" rx="10" fill="#ffffff"/>
  <!-- tuning pegs -->
  <g fill="#dbe7f2">
    <circle cx="220" cy="74" r="6.5"/>
    <circle cx="220" cy="92" r="6.5"/>
    <circle cx="220" cy="110" r="6.5"/>
    <circle cx="292" cy="74" r="6.5"/>
    <circle cx="292" cy="92" r="6.5"/>
    <circle cx="292" cy="110" r="6.5"/>
  </g>

  <!-- neck -->
  <rect x="244" y="126" width="24" height="152" rx="3" fill="#ffffff"/>
  <!-- fret lines -->
  <g stroke="#9db6cc" stroke-width="2" opacity="0.55">
    <line x1="244" y1="156" x2="268" y2="156"/>
    <line x1="244" y1="184" x2="268" y2="184"/>
    <line x1="244" y1="212" x2="268" y2="212"/>
    <line x1="244" y1="240" x2="268" y2="240"/>
  </g>

  <!-- acoustic body: upper + lower bouts (union reads as a figure-8) -->
  <g fill="#ffffff">
    <ellipse cx="256" cy="298" rx="48" ry="50"/>
    <ellipse cx="256" cy="400" rx="64" ry="58"/>
  </g>

  <!-- strings (over body, under sound hole) -->
  <g stroke="#ffffff" stroke-width="2.2" opacity="0.38">
    <line x1="245" y1="130" x2="245" y2="428"/>
    <line x1="249.4" y1="130" x2="249.4" y2="428"/>
    <line x1="253.8" y1="130" x2="253.8" y2="428"/>
    <line x1="258.2" y1="130" x2="258.2" y2="428"/>
    <line x1="262.6" y1="130" x2="262.6" y2="428"/>
    <line x1="267" y1="130" x2="267" y2="428"/>
  </g>

  <!-- bridge -->
  <rect x="238" y="418" width="36" height="9" rx="4" fill="#e8f0f7"/>

  <!-- sound hole = check -->
  <circle cx="256" cy="338" r="42" fill="url(#blue)"/>
  <path d="M 240 340 L 253 353 L 275 324" fill="none" stroke="#ffffff"
        stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
